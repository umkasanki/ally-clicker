name: Spike - Swift on Windows

# Risk-reduction spike: does the pure AllyClickerCore build & test with the official
# Swift toolchain on Windows? Informs the Windows-port decision (C# rewrite vs.
# reusing this core as a native DLL). Manual trigger only — delete once decided.
#
# History: 6.0.3 installed but failed "could not build module 'ucrt'" (toolchain vs.
# Windows SDK mismatch). Newer versions 404'd with the new input names, so use the
# branch/tag form that worked, and enter the VS developer environment first (the
# usual cure for the ucrt/WinSDK module-map mismatch).

on:
  workflow_dispatch:

jobs:
  core-on-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.1.2", "6.2"]
    name: core (Swift ${{ matrix.swift }})
    steps:
      - uses: actions/checkout@v5

      - name: Set up Visual Studio dev environment
        uses: compnerd/gha-setup-vsdevenv@main

      - name: Install Swift toolchain
        uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-${{ matrix.swift }}-release
          tag: ${{ matrix.swift }}-RELEASE

      - name: Swift version
        run: swift --version

      - name: Build core
        run: swift build --target AllyClickerCore
        working-directory: macos

      - name: Run core tests
        run: swift test
        working-directory: macos
